<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="22" fill="#2563EB"/>
  <path d="M20 20V80H80" stroke="#93C5FD" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Feasible region polygon -->
  <polygon points="20,80 20,50 48,36 72,55 72,80" fill="#3B82F6" fill-opacity="0.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Objective contour line -->
  <line x1="16" y1="62" x2="68" y2="24" stroke="#FDE047" stroke-width="2.5" stroke-dasharray="3 3"/>
  <!-- Optimal point -->
  <circle cx="48" cy="36" r="4.5" fill="#EF4444" stroke="#FFFFFF" stroke-width="1.5"/>
  <!-- LP Monogram -->
  <text x="62" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="900" font-size="14" letter-spacing="-0.5">LP</text>
</svg>
